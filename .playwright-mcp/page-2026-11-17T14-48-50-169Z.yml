          - heading "What we need from you" [level=2] [ref=e84]
          - paragraph [ref=e85]: We need your trip details and the estimated live weight of your catch.
          - paragraph [ref=e86]: We will ask if you caught species subject to catch limits (quota). If you did, all sizes of fish must be recorded unless exemptions apply.
          - heading "When to create your record" [level=2] [ref=e87]
          - paragraph [ref=e88]: "Create your record before you move your catch off the boat if:"
          - list [ref=e89]:
            - listitem [ref=e90]: You caught any species with catch limits (quota)
            - listitem [ref=e91]: You crossed an ICES area boundary while fishing animal productivity
            - listitem [ref=e92]: You caught only non-quota species.
          - generic [ref=e93]:
            - generic [aria-hidden] [ref=e94]: "!"
            - strong [ref=e95]:
              - generic [ref=e96]: Warning
              - text: You need to create a catch record within 24 hours of landing your catch.
          - 'heading "Special cases: ICES areas" [level=2] [ref=e97]'
          - paragraph [ref=e98]: If you fished in or crossed ICES areas 4c, 7d or 7e, create a separate catch record each time you cross a boundary. You must use the mobile app for offline recording.
          - heading "How to create a record" [level=2] [ref=e99]
          - paragraph [ref=e100]:
            - text: Use the web service or download the
            - link "Android" [ref=e101] [cursor=pointer]:
              - /url: https://play.google.com/store/apps/details?id=uk.gov.mmo.rcapp&hl=en&gl=GB
            - text: or
            - link "Apple" [ref=e102] [cursor=pointer]:
              - /url: https://apps.apple.com/gb/app/record-your-catch/id1475243969
            - text: app.
          - button "Start now" [ref=e103] [cursor=pointer]
          - heading "Get help with your record" [level=2] [ref=e106]
          - paragraph [ref=e107]: Call 0300 020 3788, Monday to Friday, 9am to 5pm.
          - paragraph [ref=e108]: (Calls to 03 numbers cost the same as 01 or 02 calls.)
          - paragraph [ref=e109]: Outside these hours, leave a catch record on our automated line.
