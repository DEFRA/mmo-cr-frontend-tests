      - generic [ref=f4e160]:
        - group [ref=f4e161]:
          - generic "Help with catch recording" [ref=f4e162] [cursor=pointer]
          - generic [ref=f4e163]:
            - heading "What you need to do" [level=2] [ref=f4e164]
            - paragraph [ref=f4e165]: You must record all catches unless an exemption applies.
            - paragraph [ref=f4e166]: We’ll ask whether you caught any species subject to catch limits (quota).
            - heading "When to create your record" [level=2] [ref=f4e167]
            - paragraph [ref=f4e168]: "Create your catch record before moving your catch off the vessel if you:"
            - list [ref=f4e169]:
              - listitem [ref=f4e170]: caught any species subject to catch limits (quota)
              - listitem [ref=f4e171]: caught only non-quota species
              - listitem [ref=f4e172]: crossed an ICES area boundary while fishing
            - 'heading "Special cases: ICES areas" [level=2] [ref=f4e173]'
            - paragraph [ref=f4e174]: If you fish in or cross ICES areas 4c, 7d or 7e, you must create a separate catch record each time you cross a boundary.
            - paragraph [ref=f4e175]: If you need to record catches without an internet connection, use the mobile app.
            - heading "Get help with your record" [level=2] [ref=f4e176]
            - paragraph [ref=f4e177]: Call 0300 020 3788, Monday to Friday, 8am to 6pm.
            - paragraph [ref=f4e178]: Calls to 03 numbers cost the same as calls to 01 or 02 numbers.
            - paragraph [ref=f4e179]: Outside these hours, leave a catch record on our automated line.
        - group [ref=f4e180]:
          - generic "Catch record statuses" [ref=f4e181] [cursor=pointer]
          - generic [ref=f4e182]:
            - paragraph [ref=f4e183]:
              - strong [ref=f4e184]: "Unsent:"
            - paragraph [ref=f4e185]: Saved on your device and not yet submitted.
            - paragraph [ref=f4e186]:
              - strong [ref=f4e187]: "Submitted:"
            - paragraph [ref=f4e188]: Received by the MMO.
            - paragraph [ref=f4e189]:
              - strong [ref=f4e190]: "Amended:"
            - paragraph [ref=f4e191]: This record was changed after it was submitted.
            - paragraph [ref=f4e192]:
              - strong [ref=f4e193]: "Late:"
            - paragraph [ref=f4e194]: This record was submitted and received late by the MMO.
            - paragraph [ref=f4e195]:
              - link "Check the How to record a catch tab" [ref=f4e196] [cursor=pointer]:
                - /url: /
              - text: to make sure this record meets the recording requirements for your catch and fishing area.
