      - generic [ref=f1e160]:
        - group [ref=f1e161]:
          - generic "Help with catch recording" [ref=f1e162] [cursor=pointer]
          - generic [ref=f1e163]:
            - heading "What you need to do" [level=2] [ref=f1e164]
            - paragraph [ref=f1e165]: You must record all catches unless an exemption applies.
            - paragraph [ref=f1e166]: We’ll ask whether you caught any species subject to catch limits (quota).
            - heading "When to create your record" [level=2] [ref=f1e167]
            - paragraph [ref=f1e168]: "Create your catch record before moving your catch off the vessel if you:"
            - list [ref=f1e169]:
              - listitem [ref=f1e170]: caught any species subject to catch limits (quota)
              - listitem [ref=f1e171]: caught only non-quota species
              - listitem [ref=f1e172]: crossed an ICES area boundary while fishing
            - 'heading "Special cases: ICES areas" [level=2] [ref=f1e173]'
            - paragraph [ref=f1e174]: If you fish in or cross ICES areas 4c, 7d or 7e, you must create a separate catch record each time you cross a boundary.
            - paragraph [ref=f1e175]: If you need to record catches without an internet connection, use the mobile app.
            - heading "Get help with your record" [level=2] [ref=f1e176]
            - paragraph [ref=f1e177]: Call 0300 020 3788, Monday to Friday, 8am to 6pm.
            - paragraph [ref=f1e178]: Calls to 03 numbers cost the same as calls to 01 or 02 numbers.
            - paragraph [ref=f1e179]: Outside these hours, leave a catch record on our automated line.
        - group [ref=f1e180]:
          - generic "Catch record statuses" [ref=f1e181] [cursor=pointer]
          - generic [ref=f1e182]:
            - paragraph [ref=f1e183]:
              - strong [ref=f1e184]: "Unsent:"
            - paragraph [ref=f1e185]: Saved on your device and not yet submitted.
            - paragraph [ref=f1e186]:
              - strong [ref=f1e187]: "Submitted:"
            - paragraph [ref=f1e188]: Received by the MMO.
            - paragraph [ref=f1e189]:
              - strong [ref=f1e190]: "Amended:"
            - paragraph [ref=f1e191]: This record was changed after it was submitted.
            - paragraph [ref=f1e192]:
              - strong [ref=f1e193]: "Late:"
            - paragraph [ref=f1e194]: This record was submitted and received late by the MMO.
            - paragraph [ref=f1e195]:
              - link "Check the How to record a catch tab" [ref=f1e196] [cursor=pointer]:
                - /url: /
              - text: to make sure this record meets the recording requirements for your catch and fishing area.
