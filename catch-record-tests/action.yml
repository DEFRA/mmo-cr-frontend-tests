name: Catch Record Tests on GitHub
description: Starts the docker compose environment and runs the Playwright journey tests against it

inputs:
  example-node-backend:
    required: false
    type: string
  example-node-frontend:
    required: false
    type: string
  project:
    description: 'Which Playwright projects to run: all, ui or api'
    required: false
    type: string
    default: all
  env:
    description: 'Environment to run tests against'
    required: false
    type: string
    default: test
  browser:
    description: 'Browser to run UI tests on'
    required: false
    type: string
    default: Chromium
  email:
    description: 'Email for sign-in tests'
    required: false
    type: string
  password:
    description: 'Password for sign-in tests'
    required: false
    type: string
  api-token:
    description: 'API token for API tests'
    required: false
    type: string
  api-base-url:
    description: 'Base URL for API tests (defaults to the frontend URL)'
    required: false
    type: string

runs:
  using: 'composite'
  steps:
    - uses: actions/checkout@v4

    - name: Docker Login
      uses: DEFRA/cdp-build-action/docker-login@main

    - uses: actions/setup-node@v4
      with:
        node-version-file: .nvmrc
        cache: npm
    - name: Setup the tests
      run: npm ci
      shell: bash
    - name: Install Playwright browsers
      if: inputs.project != 'api'
      shell: bash
      run: |
        case "${{ inputs.browser }}" in
          Chrome) npx playwright install --with-deps chrome ;;
          Edge) npx playwright install --with-deps msedge ;;
          Firefox) npx playwright install --with-deps firefox ;;
          Safari|"Mobile iOS") npx playwright install --with-deps webkit ;;
          all) npx playwright install --with-deps chromium chrome msedge firefox webkit ;;
          *) npx playwright install --with-deps chromium ;;
        esac
    - name: Start docker compose
      shell: bash
      run: |
        CDP_EXAMPLE_NODE_FRONTEND=${{inputs.example-node-frontend}} \
        CDP_EXAMPLE_NODE_BACKEND=${{inputs.example-node-backend}} \
        docker compose up --wait-timeout 300 -d --quiet-pull
    - name: Run the tests
      shell: bash
      env:
        CATCH_RECORDING_ENV: ${{ inputs.env }}
        CATCH_RECORDING_EMAIL: ${{ inputs.email }}
        CATCH_RECORDING_PASSWORD: ${{ inputs.password }}
        CATCH_RECORDING_API_TOKEN: ${{ inputs.api-token }}
        CATCH_RECORDING_API_BASE_URL: ${{ inputs.api-base-url }}
      run: |
        if [ "${{ inputs.project }}" = "ui" ]; then
          if [ "${{ inputs.browser }}" = "all" ]; then
            npm run test:ui:all
          elif [ -z "${{ inputs.browser }}" ]; then
            npm run test:ui
          else
            npx playwright test --project="${{ inputs.browser }}"
          fi
        elif [ "${{ inputs.project }}" = "api" ]; then
          npm run test:api
        else
          if [ "${{ inputs.browser }}" != "all" ] && [ -n "${{ inputs.browser }}" ]; then
            npx playwright test --project="${{ inputs.browser }}"
          else
            npm test
          fi
        fi
    - name: Generate Allure report
      if: always()
      shell: bash
      run: |
        npm run report || true
    - name: debug
      if: always()
      run: |
        docker compose logs > logs.txt
        docker ps
      shell: bash
    - name: Upload Allure report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: allure-report-${{ inputs.project }}
        path: ./allure-report
    - name: Upload docker compose logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: docker-compose-logs-${{ inputs.project }}
        path: ./logs.txt
